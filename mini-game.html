<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мини-игра Скидка</title>
    <style>
        :root {
            --bg-purple: #9A7BFF;
            --primary-lime: #D0FF1A;
            --secondary-orange: #FF6E1A;
            --btn-purple: #6E44FF;
            --text-dark: #222222;
            --text-white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #1a1a1a;
        }

        .app-container {
            width: 393px; height: 852px; background-color: var(--bg-purple); position: relative; overflow: hidden;
            border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
        }

        /* Top Nav Area */
        .nav-container {
            display: flex; justify-content: space-between; align-items: flex-start; padding: 30px 20px 0; z-index: 10;
        }

        .back-btn {
            width: 45px; height: 45px; background-color: var(--btn-purple); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: var(--text-white); font-size: 24px; cursor: pointer;
        }

        .gift-badge {
            background-color: var(--primary-lime); color: var(--text-dark); padding: 10px 25px; border-radius: 30px;
            font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(208, 255, 26, 0.4);
        }

        .action-btns { display: flex; flex-direction: column; gap: 15px; }
        .action-btn {
            width: 45px; height: 45px; background-color: var(--btn-purple); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: var(--text-white); font-size: 20px; cursor: pointer;
        }

        /* Game Area */
        .game-area {
            flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; margin-top: 20px;
        }

        .track-container {
            position: absolute; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;
            transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .track-card {
            width: 85%; height: 130px; border-radius: 25px; display: flex; justify-content: center; align-items: center;
            font-size: 60px; font-weight: 900; font-style: italic; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Tails */
        .track-card::after {
            content: ''; position: absolute; bottom: -10px; width: 25px; height: 25px; background: inherit; border-radius: 50%; z-index: -1;
        }
        .track-card:nth-child(even)::after { left: 40px; }
        .track-card:nth-child(odd)::after { right: 40px; }

        .card-1 { background: linear-gradient(135deg, var(--primary-lime) 0%, var(--btn-purple) 100%); color: var(--text-white); }
        .card-2 { background-color: var(--primary-lime); color: var(--secondary-orange); }
        .card-3 { background-color: var(--secondary-orange); color: var(--text-white); }

        .nav-arrows {
            position: absolute; top: 50%; transform: translateY(-50%); width: 100%; display: none; justify-content: space-between; pointer-events: none; z-index: 5;
        }
        .arrow { width: 0; height: 0; border-top: 30px solid transparent; border-bottom: 30px solid transparent; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .arrow-left { border-right: 45px solid var(--secondary-orange); margin-left: -5px; }
        .arrow-right { border-left: 45px solid var(--secondary-orange); margin-right: -5px; }

        /* Bottom Bar */
        .bottom-bar {
            padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; padding-bottom: 40px;
        }
        .buy-btn {
            background-color: var(--secondary-orange); color: var(--text-white); padding: 20px; border-radius: 35px;
            font-size: 20px; font-weight: 900; border: none; cursor: pointer; flex: 1; margin-right: 15px; text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(255, 110, 26, 0.4);
        }
        
        /* Result Screen */
        .result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-purple);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px;
        }

        /* Squiggly lines background */
        .result-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg"><path d="M0 100 Q 100 50, 200 150 T 400 100 M 0 300 Q 100 250, 200 350 T 400 300 M 0 500 Q 100 450, 200 550 T 400 500 M 0 700 Q 100 650, 200 750 T 400 700" fill="none" stroke="black" stroke-width="2"/></svg>');
            background-size: cover;
        }

        .result-content { z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; }

        /* Starburst */
        .starburst {
            position: absolute; top: 20%; width: 300px; height: 300px; background-color: var(--primary-lime);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 2; animation: spin 20s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Ticket Card */
        .result-card {
            background-color: var(--secondary-orange); width: 220px; height: 140px; border-radius: 20px;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 15px 35px rgba(255, 110, 26, 0.5);
            position: relative; z-index: 3; margin-top: 100px; margin-bottom: 40px;
            /* Cutouts for ticket shape */
            mask-image: radial-gradient(circle at 0% 50%, transparent 15px, black 16px), radial-gradient(circle at 100% 50%, transparent 15px, black 16px);
            mask-size: 51% 100%; mask-repeat: no-repeat; mask-position: left center, right center;
            -webkit-mask-image: radial-gradient(circle at 0% 50%, transparent 15px, black 16px), radial-gradient(circle at 100% 50%, transparent 15px, black 16px);
            -webkit-mask-size: 51% 100%; -webkit-mask-repeat: no-repeat; -webkit-mask-position: left center, right center;
        }
        .result-card::after { /* The dashed line */
            content: ''; position: absolute; right: 35px; top: 10%; height: 80%; width: 2px; border-left: 3px dashed rgba(255,255,255,0.5);
        }

        .result-discount { color: var(--text-white); font-size: 70px; font-weight: 900; font-style: italic; z-index: 4; margin-right: 20px; }

        .result-text { color: var(--text-white); font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px; max-width: 280px; line-height: 1.4; z-index: 3; }

        .claim-btn {
            background-color: var(--secondary-orange); color: var(--text-white); padding: 18px 30px; border-radius: 35px;
            font-size: 18px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 110, 26, 0.4);
            width: 80%; display: flex; justify-content: space-between; align-items: center; z-index: 3; margin-top: 20px;
        }
        .claim-btn .gift-badge { background-color: var(--primary-lime); padding: 5px 15px; font-size: 16px; box-shadow: none; color: var(--text-dark); }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Навигационная панель (Фиолетовый фон) -->
        <div class="nav-container">
            <div class="back-btn">‹</div>
            <div class="gift-badge" id="topGiftBadge">1 🎁</div>
            <div class="action-btns">
                <div class="action-btn">✉</div>
                <div class="action-btn">?</div>
            </div>
        </div>

        <!-- Центральная область с рулеткой -->
        <div class="game-area">
            <div class="nav-arrows" id="navArrows">
                <div class="arrow arrow-left"></div>
                <div class="arrow arrow-right"></div>
            </div>
            
            <div class="track-container" id="trackContainer"></div>
        </div>

        <!-- Нижняя панель действий -->
        <div class="bottom-bar" id="bottomBar">
            <button class="buy-btn" id="buyBtn">Купи ТИТР</button>
            <div class="gift-badge" id="bottomGiftStatus">1 🎁</div>
        </div>

        <!-- Экран отображения результатов игры -->
        <div class="result-screen" id="resultScreen">
            <div class="result-bg"></div>
            
            <div class="result-content">
                <div class="starburst"></div>
                <div class="result-card">
                    <div class="result-discount" id="wonDiscount">20%</div>
                </div>
                
                <p class="result-text" style="margin-top: 10px;">Поздравляем! Вы выиграли 20% скидку на покупку следующих билетов</p>
                <p class="result-text" style="font-size: 14px; opacity: 0.8;">Вы можете применить её в любое время до 31.12.2026</p>
                
                <button class="claim-btn" id="claimBtn">
                    Крутить ещё раз
                    <div class="gift-badge">0 🎁</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        const buyBtn = document.getElementById('buyBtn');
        const trackContainer = document.getElementById('trackContainer');
        const navArrows = document.getElementById('navArrows');
        const resultScreen = document.getElementById('resultScreen');
        const wonDiscount = document.getElementById('wonDiscount');
        const topGiftBadge = document.getElementById('topGiftBadge');
        const bottomGiftStatus = document.getElementById('bottomGiftStatus');
        const claimBtn = document.getElementById('claimBtn');

        const discounts = ['10%', '15%', '20%'];
        const cardClasses = ['card-1', 'card-2', 'card-3'];

        function initTracks() {
            let html = '';
            for (let i = 0; i < 30; i++) {
                const discount = discounts[Math.floor(Math.random() * discounts.length)];
                const cardClass = cardClasses[i % cardClasses.length];
                
                let content = discount;
                if (i === 0) content = '10%';
                if (i === 1) content = '15%';
                if (i === 2) content = '20%';

                html += `<div class="track-card ${cardClass}" id="track-${i}">${content}</div>`;
            }
            trackContainer.innerHTML = html;
            trackContainer.style.transform = 'translateY(20px)';
        }

        function startGame() {
            topGiftBadge.innerHTML = '0 🎁';
            bottomGiftStatus.innerHTML = '0 🎁';
            navArrows.style.display = 'flex';

            const targetIndex = 20 + Math.floor(Math.random() * 5);
            const targetCard = document.getElementById(`track-${targetIndex}`);
            
            const offset = - (targetIndex * 150) + (trackContainer.parentElement.clientHeight / 2) - 65;
            
            trackContainer.style.transform = `translateY(${offset}px)`;

            setTimeout(() => {
                showResult(targetCard.innerText);
            }, 3200);
        }

        function showResult(discountValue) {
            wonDiscount.innerText = discountValue;
            // Update text based on won discount if needed
            document.querySelector('.result-content p').innerText = `Поздравляем! Вы выиграли ${discountValue} скидку на покупку следующих билетов`;
            resultScreen.style.display = 'flex';
        }

        buyBtn.addEventListener('click', () => {
            startGame();
            buyBtn.disabled = true;
            buyBtn.style.opacity = '0.7';
        });

        claimBtn.addEventListener('click', () => {
            resultScreen.style.display = 'none';
            buyBtn.disabled = false;
            buyBtn.style.opacity = '1';
            topGiftBadge.innerHTML = '1 🎁';
            bottomGiftStatus.innerHTML = '1 🎁';
            navArrows.style.display = 'none';
            trackContainer.style.transition = 'none';
            
            initTracks();
            
            setTimeout(() => {
                trackContainer.style.transition = 'transform 3s cubic-bezier(0.1, 0.7, 0.1, 1)';
            }, 50);
        });

        initTracks();
    </script>
</body>
</html>
